<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" width="720" height="416" role="img" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#1A1816"><title>Four days of cleaned feed rate, with what two statistical rules would keep</title><desc>The box-plot rule keeps only 937 to 1,104 t/h, so it flags the surge, the trip, the shutdown, the empty belt and a real low-feed hour. Three-sigma limits of 732 and 1,289 t/h flag the stops and almost none of the surge.</desc><text x="46.0" y="22.0" text-anchor="start" fill="#1A1816" font-size="13" font-weight="600">Cleaned records over four days (t/h)</text><line x1="46.0" y1="40.0" x2="60.0" y2="40.0" stroke="#B84F33" stroke-width="1.2" stroke-linecap="round"/><text x="66.0" y="44.0" text-anchor="start" fill="#6B655E" font-size="12" font-weight="400">Cleaned records</text><rect x="46" y="53" width="14" height="10" rx="2" fill="#EFE7DA"/><text x="66.0" y="62.0" text-anchor="start" fill="#6B655E" font-size="12" font-weight="400">Box-plot rule keeps 937 to 1,104</text><line x1="46.0" y1="76.0" x2="60.0" y2="76.0" stroke="#1A1816" stroke-width="2.5" stroke-linecap="round"/><text x="66.0" y="80.0" text-anchor="start" fill="#6B655E" font-size="12" font-weight="400">3-sigma limits, 732 and 1,289</text><clipPath id="c3296-1"><rect x="46" y="123" width="662" height="242"/></clipPath><rect x="46" y="174.8" width="662" height="28.6" fill="#EFE7DA"/><line x1="46.0" y1="364.0" x2="708.0" y2="364.0" stroke="#1A1816" stroke-width="1" stroke-linecap="butt"/><text x="38.0" y="368.0" text-anchor="end" fill="#6B655E" font-size="12" font-weight="400">0</text><line x1="46.0" y1="278.3" x2="708.0" y2="278.3" stroke="#E6E1D9" stroke-width="1" stroke-linecap="butt"/><text x="38.0" y="282.3" text-anchor="end" fill="#6B655E" font-size="12" font-weight="400">500</text><line x1="46.0" y1="192.6" x2="708.0" y2="192.6" stroke="#E6E1D9" stroke-width="1" stroke-linecap="butt"/><text x="38.0" y=