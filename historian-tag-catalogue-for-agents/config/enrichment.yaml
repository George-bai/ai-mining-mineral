# Words a user may say, and the words the catalogue uses.
synonyms:
  consumption: [power, energy, load]
  draw: [power, current]
  load: [power, current]
  amps: [current]
  throughput: [feed, rate]
  tonnage: [feed, rate]
  tph: [feed, rate]
  grade: [au, ag, pb, sulphur, analyser]
  assay: [au, ag, pb, sulphur, analyser]
  gold: [au]
  silver: [ag]
  lead: [pb]
  sulfur: [sulphur]
  sulphur: [s, sulphur]
  tails: [tail]
  tailings: [tail, thickener]
  conc: [concentrate]
  uptime: [run, status, hours]
  running: [run, status]
  online: [run, status]
  speed: [speed, spd]
  water: [water, h2o]
  dosage: [dose, rate]
  addition: [dose, rate]
  solids: [density, solids]
  froth: [froth, depth]
  oxygen: [dissolved, oxygen, do]
  cyanide: [cyanide, cn]
  incomer: [main, incomer]
  site-wide: [main, incomer]
  mill: [sag, ball, mill]

# Quantity words in a question: used to boost tags of that quantity.
quantity_words:
  power: [power, consumption, draw, kw, mw, megawatts, electricity, load]
  energy: [energy, mwh, kwh]
  flow: [flow, flowrate, water, dose, dosage, addition]
  rate: [throughput, tonnage, tph, feed rate]
  pressure: [pressure, kpa, bar]
  density: [density, solids]
  level: [level]
  composition: [grade, assay, au, ag, gold, silver, ph, cyanide, oxygen, sulphur, lead]
  current: [current, amps]
  speed: [speed, rpm]
  status: [status, running, online, stopped]
  duration: [hours, uptime]

# Curated "known good" tags for common questions, relative to a concentrator.
golden_tags:
  - {kpi: throughput, path: 'Grinding\SAG Mill|Fresh Feed Rate'}
  - {kpi: power, path: 'Utilities\Main Incomer|Active Power'}
  - {kpi: energy, path: 'Utilities\Main Incomer|Energy'}
  - {kpi: raw water, path: 'Utilities\Raw Water|Flow'}

stale_after_hours: 24
