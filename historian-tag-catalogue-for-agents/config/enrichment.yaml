# Enrichment rules: how the crawler makes tags findable by meaning. A site supplies its own; the code stays
# the same. Nothing here mentions recovery: the historian has no such tag, and No. 5 of the series tests whether
# an agent works that out (series.md).

# Names of the asset-tree levels below the database, top down.
levels: [enterprise, site, concentrator, area, equipment]

# Regex rewrites applied (case-sensitive) to point names before decoding, so each site's location codes read as
# words. One rule per naming style in config/plant.yaml.
aliases:
  - ['\bS([A-Z]{1,2}?)-C(\d)-', 'site \1 concentrator \2 ']          # SA-C1-FT-3104
  - ['\bS([A-Z]{1,2}?)C(\d)_', 'site \1 concentrator \2 ']           # SBC1_BM2_PWR
  - ['\bSITE([A-Z]{1,2})\.CONC(\d)\.', 'site \1 concentrator \2 ']  # SITEC.CONC1.GRD.BM2.PWR
  - ['\bS([A-Z]{1,2}?)(\d):', 'site \1 concentrator \2 ']            # SD1:3FT104

# Abbreviations in point names and descriptors. Equipment abbreviations are followed by a number (BM2).
equipment_abbrev:
  CR: crusher
  CV: conveyor
  SAG: sag mill
  BM: ball mill
  CYC: cyclone cluster
  PP: slurry pump
  FC: flotation cell
  RD: reagent dosing
  AN: analyser
  TH: thickener
  LT: leach tank
  BL: blower
  PM: power meter
  AC: air compressor
  FM: flow meter
  TK: tank
attribute_abbrev:
  PWR: power
  AMP: current amps
  CSS: closed side setting
  RUN: run status
  RATE: rate
  SPD: speed
  FEED: feed rate
  BRGP: bearing pressure
  H2O: water flow
  HRS: run hours
  DEN: density
  PRES: pressure
  FDEN: feed density
  FLOW: flow
  ODEN: overflow density
  NOPEN: cyclones open
  AIR: air flow
  LVL: level
  FROTH: froth depth
  DOSE: dose rate
  AU: gold au
  AG: silver ag
  PB: lead pb
  SUL: sulphur
  SOL: solids
  UDEN: underflow density
  TORQ: torque
  BED: bed level
  FLOC: flocculant
  PH: ph
  DO: dissolved oxygen
  CN: cyanide
  KW: power
  MWH: energy
  PF: power factor
  TOT: totalised
area_abbrev:
