  FI: flow
  FQ: volume
  PT: pressure
  PI: pressure
  TT: temperature
  JT: power
  JQ: energy
  IT: current
  WT: rate
  ST: speed
  SC: speed
  LT: level
  DT: density
  AT: composition
  XS: status
  KQ: duration
  ZT: position
  ZI: count

# Units to quantity.
units:
