  MW: power
  MWh: energy
  A: current
  t/h: rate
  m3/h: flow
  L/s: flow
  m3: volume
  kPa: pressure
  bar: pressure
  rpm: speed
  m/s: speed
  g/t: composition
  ppm: composition
  pH: composition
  mL/min: flow
  h: duration
  mm: length
