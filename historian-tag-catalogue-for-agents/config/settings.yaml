# The MCP server's settings. Environment variables of the same name in capitals override them
# (HISTORIAN_URL, HISTORIAN_AUTH, HISTORIAN_USER, HISTORIAN_PASSWORD, CATALOG, DATASETS, AUDIT_LOG, MCP_API_KEY).
historian_url: http://127.0.0.1:8711/piwebapi
historian_auth: basic           # none | basic | bearer; a real server: a read-only service account over HTTPS
historian_user: demo
historian_password: demo-password
catalog: local/catalog/catalog.sqlite
datasets: local/datasets
audit_log: local/audit.jsonl
timezone: Australia/Brisbane

limits:
  calls_per_minute: 60            # all tools together; added 24 Nov 2026, after the runs of Nos. 19 to 21
  tags_per_call: 10
  search_results: 25
  summary_intervals: 2000         # per tag
  interpolated_values: 5000       # per tag
  recorded_days: 7                # longest window for raw records
  recorded_values: 20000          # per tag
